tdengine:
  enabled: true
  url: "http://127.0.0.1:6041/rest/sql"
  database: "edgehub"
  username: "root"
  password: "taosdata"

export:
  tables:
    telemetry:
      name: telemetry
      time_column: ts
      device_column: device_id
      order_by: ts
    params_ack:
      name: params_ack
      time_column: ts
      device_column: device_id
      order_by: ts
    params_set:
      name: params_set
      time_column: ts
      device_column: device_id
      order_by: ts
    telemetry_summary:
      name: telemetry_summary
      time_column: ts
      device_column: device_id
      order_by: ts
    alarm_events:
      name: alarm_events
      time_column: ts
      device_column: device_id
      order_by: ts
  output_dir: "ml/data/raw"

windowing:
  input_parquet: "ml/data/raw/telemetry.parquet"
  output_dir: "ml/data/cleaned"
  output_file: "training_windows.parquet"
  window_minutes: 30
  stride_minutes: 5
  min_points_per_window: 30

  # "Basic stability" thresholds inside one window.
  stability:
    kp_max_delta: 0.05
    ki_max_delta: 0.02
    kd_max_delta: 0.02

  # Sampling quality checks to filter windows with severe gaps or sparse sampling.
  quality:
    max_gap_ms: 120000
    max_mean_actual_dt_ms: 30000
    min_sampling_ratio: 0.60

  points_keep_columns:
    - ts
    - target_temp_c
    - sim_temp_c
    - sensor_temp_c
    - error_c
    - integral_error
    - control_output
    - pwm_duty
    - pwm_norm
    - control_period_ms
    - saturation_state
    - sensor_valid
    - run_id
    - control_mode
    - kp
    - ki
    - kd
    - system_state
    - actual_dt_ms
    - dt_error_ms
    - fault_latched
    - fault_reason
    - has_pending_params
    - pending_params_age_ms

feature:
  input_parquet: "ml/data/cleaned/training_windows.parquet"
  output_dir: "ml/data/features"
  output_file: "training_features.parquet"
  target_band: 0.5
  saturation_pwm_threshold: 85.0

labeling:
  input_parquet: "ml/data/features/training_features.parquet"
  output_dir: "ml/data/datasets"
  output_file: "labeled_samples.parquet"

  thresholds:
    target_band: 0.5
    low_in_band_ratio: 0.4
    normal_in_band_ratio: 0.85
    overshoot_pct_high: 3.0
    oscillation_zero_crossings: 6
    oscillation_error_std: 0.4
    saturation_ratio_high: 0.5
    slow_response_rise_slope_max: 0.002
    steady_state_error_mean_abs_min: 0.5
